name: sharedcatalog
x-ch: &ch
  image: clickhouse/clickhouse-server:26.8
  depends_on: [keeper]
  ulimits: {nofile: {soft: 262144, hard: 262144}}
  healthcheck:
    test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
    interval: 3s
    retries: 30
services:
  keeper:
    image: clickhouse/clickhouse-keeper:26.8
    container_name: sc-keeper
    volumes: ["./conf/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro"]
  ch1:
    <<: *ch
    container_name: ch1
    hostname: ch1
    volumes:
      - ./conf/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./conf/macros-ch1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./conf/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch1data:/var/lib/clickhouse
  ch2:
    <<: *ch
    container_name: ch2
    hostname: ch2
    volumes:
      - ./conf/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./conf/macros-ch2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./conf/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch2data:/var/lib/clickhouse
volumes: {ch1data: {}, ch2data: {}}
