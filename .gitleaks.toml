# gitleaks configuration for clickhouse-hols
#
# This repository is public and every lab talks to a database, so connection
# details are the thing most likely to be committed by accident. The rules below
# extend the default set with ClickHouse-specific shapes; the allowlist keeps
# documented placeholders and synthetic demo data from failing every run.
#
# Local use:   gitleaks detect  --config .gitleaks.toml --no-banner --redact
# Staged only: gitleaks protect --staged --config .gitleaks.toml --no-banner

[extend]
useDefault = true

[[rules]]
id = "clickhouse-cloud-host"
description = "ClickHouse Cloud service hostname"
# Go's regexp is RE2: no lookahead, so "8-12 chars containing a digit" is
# spelled out as digit-before-or-after-letters. Doc placeholders such as
# production.us-east-1... are pure letters and therefore do not match.
regex = '''\b[a-z0-9]{0,11}[0-9][a-z0-9]{0,11}\.[a-z0-9-]+\.(aws|gcp|azure)\.clickhouse\.cloud'''
tags = ["clickhouse", "endpoint"]

[[rules]]
id = "clickhouse-cloud-api-key-secret"
description = "ClickHouse Cloud API key secret"
regex = '''(?i)(api[_-]?key[_-]?secret|CHC_API_KEY_SECRET|CLICKHOUSE_API_KEY_SECRET)\s*[:=]\s*["']?[A-Za-z0-9]{40,50}["']?'''
tags = ["clickhouse", "credential"]

[[rules]]
id = "clickhouse-cloud-api-key-id"
description = "ClickHouse Cloud API key id"
regex = '''(?i)(api[_-]?key[_-]?id|CHC_API_KEY_ID|CLICKHOUSE_API_KEY_ID)\s*[:=]\s*["']?[A-Za-z0-9]{18,24}["']?'''
tags = ["clickhouse", "credential"]

[[rules]]
id = "clickhouse-password-assignment"
description = "Non-empty ClickHouse password assigned in code or config"
regex = '''(?i)(CLICKHOUSE_PASSWORD|CH_PASSWORD|clickhouse[_-]?password)\s*[:=]\s*["'][^"'\s]{6,}["']'''
tags = ["clickhouse", "credential"]

[allowlist]
description = "Placeholders, documented demo values and synthetic datasets"
# Test the patterns below against the whole matched text, not just the captured
# secret, so `CLICKHOUSE_PASSWORD='your-password'` is recognised as a template.
regexTarget = "match"

paths = [
    '''\.example$''',
    '''\.template$''',
    '''(^|/)\.gitleaks\.toml$''',
    # Synthetic records for the PII/secret-detection demos. The "keys" in these
    # files are fabricated on purpose — detecting them is the point of the lab.
    '''usecase/security-traffic-analysis/05-generate-demo-data\.sql$''',
    '''usecase/langfuse-ee/08-generate-pii-traces\.py$''',
    # Local-only LibreChat stack. These JWT/session values are shared demo
    # defaults for a localhost deployment; replace them before exposing the
    # stack to anything else. Tracked as pending clean-up.
    '''local/llm-mac-librechat-with-clickhouse/docker-compose(\.simple)?\.yml$''',
]

regexes = [
    # placeholder shapes used throughout the docs
    '''<[A-Za-z_ -]+>''',
    '''(?i)(your|example|placeholder|changeme|change_me|dummy|sample|xxx+|redacted)''',
    '''\$\{?[A-Za-z_][A-Za-z0-9_]*(:-[^}]*)?\}?''',
    # the demo broker credential documented in the six Kafka connection guides
    '''admin-secret''',
    # local-only endpoints
    '''localhost''',
    '''127\.0\.0\.1''',
    '''clickhouse-2[0-9]-[0-9]+''',
    # the standard AWS documentation account id
    '''123456789012''',
    # the example service id used across the docs
    '''abc123\.''',
]
