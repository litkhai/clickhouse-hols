# Image pins (verified 2026-11-04, see README "Pinned versions").
# MinIO: minio/minio and minio/mc can no longer be pulled from Docker Hub, so this uses the
# Chainguard images, pinned by digest (they publish no version tags without a subscription).
# Those images have no shell, so bucket creation is one `mc` call with the MC_HOST_* alias.
services:
  # MinIO Object Storage
  minio:
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597  # RELEASE.2026-10-23T20-06-51Z
    container_name: minio
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - datalake

  # Create the bucket. The image has no shell: mc reads the alias from MC_HOST_myminio and
  # runs one command; restart until MinIO accepts it.
  minio-setup:
    image: cgr.dev/chainguard/minio-client@sha256:1dccd2a6fd59914a98ac2d9dad95e552c91243cb0bd7242aaa224802df4b3432
    container_name: minio-setup
    depends_on:
      - minio
    environment:
      MC_HOST_myminio: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-password123}@minio:9000
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "myminio/${SAMPLE_DATA_BUCKET:-warehouse}"]
    restart: on-failure
    networks:
      - datalake

  # Nessie Catalog
  nessie:
    image: ghcr.io/projectnessie/nessie:0.109.0
    container_name: nessie
    ports:
      - "${NESSIE_PORT:-19120}:19120"
    environment:
      - nessie.version.store.type=IN_MEMORY
      - nessie.server.authentication.enabled=false
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://${SAMPLE_DATA_BUCKET:-warehouse}/nessie/
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.auth-type=STATIC
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=${MINIO_ROOT_USER:-admin}
      - nessie.catalog.secrets.access-key.secret=${MINIO_ROOT_PASSWORD:-password123}
    profiles:
      - nessie
    networks:
      - datalake
    depends_on:
      - minio

  # PostgreSQL for Hive Metastore
  postgres:
    image: postgres:11.16
    container_name: postgres-hive
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hive}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    profiles:
      - hive
    networks:
      - datalake

  # Hive Metastore
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    depends_on:
      - postgres
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # hadoop-aws ships in tools/lib but is not on the metastore classpath; the s3a:// table
      # location the seed script registers needs it (the metastore only resolves the path).
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD:-hive}
    volumes:
      - ./conf/hive-core-site.xml:/opt/hive/conf/core-site.xml:ro
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    profiles:
      - hive
    networks:
      - datalake

  # Iceberg REST Catalog
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://${SAMPLE_DATA_BUCKET:-warehouse}/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
    profiles:
      - iceberg-rest
    networks:
      - datalake
    depends_on:
      - minio

  # Polaris Catalog
  polaris:
    image: apache/polaris:1.8.0
    container_name: polaris
    ports:
      - "${POLARIS_PORT:-8182}:8181"
      - "${POLARIS_MGMT_PORT:-8183}:8182"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - AWS_REGION=us-east-1
      - POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,root,s3cr3t
      - polaris.realm-context.realms=POLARIS
    profiles:
      - polaris
    networks:
      - datalake
    depends_on:
      - minio

  # Unity Catalog
  unity-catalog:
    image: unitycatalog/unitycatalog:v0.7.0
    container_name: unity-catalog
    ports:
      - "${UNITY_PORT:-8080}:8080"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
      - S3_PATH_STYLE_ACCESS=true
    volumes:
      - unity-data:/var/lib/unitycatalog
      # Unity OSS reads storage credentials from server.properties only; UNITY_SERVER_PROPERTIES
      # overrides the committed default (the datalakecatalog test writes one with MinIO STS credentials).
      - ${UNITY_SERVER_PROPERTIES:-./conf/unity-server.properties}:/home/unitycatalog/etc/conf/server.properties:ro
    profiles:
      - unity
    networks:
      - datalake
    depends_on:
      - minio

  # Jupyter Notebook for data exploration
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - AWS_REGION=us-east-1
      - SPARK_CLASSPATH=/usr/local/spark/jars/*
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./sample-data:/home/jovyan/sample-data
      - ./spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    networks:
      - datalake
    depends_on:
      - minio

networks:
  datalake:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  unity-data:
