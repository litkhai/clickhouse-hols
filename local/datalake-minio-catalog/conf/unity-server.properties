# Minimal Unity Catalog OSS server config for the lab (no authorization, local H2 state).
# S3 access: Unity OSS has no endpoint setting and vends credentials from the s3.* entries
# below. The datalakecatalog test generates a copy with MinIO STS credentials filled in.
server.env=dev
server.authorization=disable
s3.bucketPath.0=s3://warehouse
s3.region.0=us-east-1
s3.accessKey.0=
s3.secretKey.0=
s3.sessionToken.0=
