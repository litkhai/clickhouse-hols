# pg_lake + Polaris ILM analytics bench: three read paths over one Iceberg snapshot
#   A  pg-main  : pg_lake native (pgduck_server / DuckDB)      -- baseline
#   B  pg-duck  : pg_duckdb (DuckDB iceberg extension)
#   C  pg-main  : pg_clickhouse FDW -> clickhouse (DataLakeCatalog REST)
name: pg-analytics

x-engine-limits: &engine-limits
  cpus: ${ENGINE_CPUS:-4}
  mem_limit: ${ENGINE_MEM:-4g}

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: pga-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports: ["19000:9000", "19001:9001"]
    volumes: [minio-data:/bitnami/minio/data]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 3s
      retries: 30

  polaris-db:
    image: postgres:17
    container_name: pga-polaris-db
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    volumes: [polaris-db:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris"]
      interval: 3s
      retries: 30

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    container_name: pga-polaris-bootstrap
    depends_on:
      polaris-db: {condition: service_healthy}
    environment: &polaris-jdbc
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    # idempotent: skips (exit 0) when the realm is already bootstrapped
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,${POLARIS_ROOT_ID},${POLARIS_ROOT_SECRET}"]
    restart: "no"

  polaris:
    image: apache/polaris:1.7.0
    container_name: pga-polaris
    depends_on:
      polaris-bootstrap: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    environment:
      <<: *polaris-jdbc
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Polaris reads table metadata files itself on loadTable
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\",\"S3\"]"
      polaris.readiness.ignore-severe-issues: "true"
      # pg_lake picks its own table locations under default_location_prefix
      polaris.features."ALLOW_UNSTRUCTURED_TABLE_LOCATION": "true"
      polaris.features."ALLOW_EXTERNAL_TABLE_LOCATION": "true"
      polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION": "true"
      JAVA_OPTS_APPEND: "-Xmx1g"
    ports: ["18181:8181"]
    cpus: 2
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8182/q/health"]
      interval: 3s
      retries: 40
      start_period: 10s

  pg-main:
    image: pg-analytics/pg-main:pg18-lake3.5.3-ch0.3.2
    build: ./images/pg-main
    container_name: pga-pg-main
    depends_on:
      polaris: {condition: service_healthy}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: minio:9000
      ICEBERG_LOCATION_PREFIX: s3://${S3_BUCKET}/lake/
      PGDUCK_MEMORY_LIMIT: ${PGDUCK_MEMORY_LIMIT:-2500MB}
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-1GB}
    ports: ["15432:5432"]
    volumes: [pgmain-data:/var/lib/pgsql]
    shm_size: 1g
    <<: *engine-limits
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 40

  pg-duck:
    image: pgduckdb/pgduckdb:18-v1.1.1
    container_name: pga-pg-duck
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_duckdb
      - -c
      - duckdb.max_memory=${PGDUCK_MEMORY_LIMIT:-2500MB}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - work_mem=256MB
      - -c
      - autovacuum=off
    ports: ["15433:5432"]
    volumes: [pgduck-data:/var/lib/postgresql]
    shm_size: 1g
    <<: *engine-limits
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 40

  # B' (reference): unreleased pg_duckdb main build (1.2.0, DuckDB 1.5.4). The
  # released 1.1.1 / DuckDB 1.4.3 iceberg extension prunes month-partitioned
  # files wrongly on range filters; see RESULTS.md. Same wiring as pg-duck.
  pg-duck-main:
    image: pgduckdb/pgduckdb:18-main
    container_name: pga-pg-duck-main
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_duckdb
      - -c
      - duckdb.max_memory=${PGDUCK_MEMORY_LIMIT:-2500MB}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - work_mem=256MB
      - -c
      - autovacuum=off
    ports: ["15434:5432"]
    volumes: [pgduckmain-data:/var/lib/postgresql]
    shm_size: 1g
    <<: *engine-limits
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 40

  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    container_name: pga-clickhouse
    depends_on:
      polaris: {condition: service_healthy}
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports: ["18123:8123", "19009:9000"]
    volumes:
      - ./init/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./init/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    <<: *engine-limits
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 3s
      retries: 40

  # Drives every phase; talks to the Docker API to pause/restart engines and
  # read cgroup CPU counters, so it gets the socket.
  runner:
    build: ./images/runner
    image: pg-analytics/runner:1
    container_name: pga-runner
    profiles: ["tools"]
    working_dir: /lab
    env_file: .env
    volumes:
      - .:/lab
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: 2
    mem_limit: 2g

volumes:
  minio-data:
  polaris-db:
  pgmain-data:
  pgduck-data:
  pgduckmain-data:
  ch-data:
